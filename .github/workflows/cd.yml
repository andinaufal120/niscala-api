name: CD

# Deploys a release tag to Fly.io. release-please.yml calls this after it
# publishes a release. To redeploy a tag by hand, run it from the Actions tab.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy, e.g. v0.7.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to Fly.io (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy
        run: flyctl deploy --remote-only -a niscala-api-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
