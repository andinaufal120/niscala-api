[project]
name = "niscala-api"
version = "0.6.0"
description = "Backend API for Niscala: business rules, data and the API contract for the Niscala app."
readme = "README.md"
authors = [
    { name = "Andi Naufal Nurfadhil", email = "111062395+andinaufal120@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.126",
    "cryptography>=50.0.2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.2",
    "firebase-admin>=7.7.0",
    "google-auth>=2.62.0",
    "google-genai>=2.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "tzdata>=2026.5",
]

[project.scripts]
niscala-api = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadfile"

[tool.ruff]
extend-exclude = [".claude"]
