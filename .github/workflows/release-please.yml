name: Release

# Keeps a release pull request up to date from the Conventional Commits on main.
# Merging that pull request bumps the version, writes CHANGELOG.md, tags
# v<version>, publishes the GitHub release and deploys it (cd.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A token other than GITHUB_TOKEN lets CI run on the release pull request.
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cd.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
