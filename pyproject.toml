[project]
name = "niscala-api"
version = "0.1.0"
description = "Backend API for Niscala: business rules, data and the API contract for the Niscala app."
readme = "README.md"
authors = [
    { name = "Andi Naufal Nurfadhil", email = "111062395+andinaufal120@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.2",
]

[project.scripts]
niscala-api = "app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
