# Fly.io configuration of the production app. The development app is in fly.toml.
# Deploy with: flyctl deploy -c fly.prod.toml -a niscala-api

app = 'niscala-api'
primary_region = 'sin'

[deploy]
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
