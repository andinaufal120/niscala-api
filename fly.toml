# fly.toml app configuration file generated for niscala-api-dev on 2026-10-24T21:40:16+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'niscala-api-dev'
primary_region = 'sin'

[deploy]
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
